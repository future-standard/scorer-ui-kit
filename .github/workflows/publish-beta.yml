name: NPM Publish (Beta)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

# OIDC trusted publishing: GitHub mints a short-lived id-token that npm verifies
# against the trusted publisher configured for `scorer-ui-kit` (this repo +
# workflow filename). No long-lived NPM_TOKEN secret is used.
#
# This file has its own trusted publisher entry on npm (filename
# `publish-beta.yml`), separate from the one for `publish.yml`. Renaming this
# file breaks beta publishing until the npm entry is updated to match.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      # npm >= 11.5.1 (bundled with Node 24) performs the OIDC token exchange
      # automatically. `prepublishOnly` runs the build; provenance is generated
      # automatically for this public repo + public package.
      #
      # The suffix guard keeps this workflow from ever moving the `beta`
      # dist-tag onto a stable version: it only runs for `vX.Y.Z-beta.N` tags,
      # but the tag and package.json can disagree, and package.json is what
      # gets published.
      #
      # The version guard keeps re-runs idempotent: native `npm publish` errors
      # (EPUBLISHCONFLICT) when the version already exists. Re-running a tag that
      # is already published is therefore a no-op success, not a red run.
      - name: Publish to npm under the beta dist-tag (skip if version already on registry)
        run: |
          VERSION=$(node -p "require('./packages/ui-lib/package.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "::error::package.json version '${VERSION}' is not a beta version (X.Y.Z-beta.N); refusing to publish under the beta dist-tag."
            exit 1
          fi
          if [ -n "$(npm view "scorer-ui-kit@${VERSION}" version 2>/dev/null)" ]; then
            echo "scorer-ui-kit@${VERSION} is already published; skipping publish."
            exit 0
          fi
          npm publish -w packages/ui-lib --tag beta
